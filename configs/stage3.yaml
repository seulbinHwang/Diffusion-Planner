# configs/stage3.yaml
name: stage3_test4
past_name: stage2_test4

batch_size: 8
train_epochs: 1 #36 #360              # 234 + 90 + 36

# Stage3: Stage1 max lr의 1/4에서 시작 → 1/5 근처까지 감소
learning_rate: 1.25e-4         # ≈ 5e-4 / 4
min_learning_rate: 1.0e-4      # ≈ 5e-4 / 5

# Stage3도 ego 기준 150m full context 유지
center_crop_radius_m: -1.
center_crop_mode: none
do_not_clip: true

# Group 설정:
#  - 모든 모듈 unfreeze
#  - encoder_local 만 lr 0.1배 (Group A)
freeze_encoder_local: false
encoder_local_lr_scale: 0.1
encoder_global_lr_scale: 1.0
decoder_lr_scale: 1.0

lr_scheduler_type: cosine
use_lr_warmup: true
warm_up_epoch: 3
p_sat: 0.1

resume_local_path_model_path: null
# Stage3도 shell에서 --resume_wandb_model_name latest 로 시작
resume_wandb_model_name: latest
resume_model_only: true